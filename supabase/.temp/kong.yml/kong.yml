_format_version: "1.1"
_transform: true

services:
- name: rest
  url: http://rest:3000
  routes:
  - name: rest-all
    paths:
    - /rest/v1
    - /rest/v1/*

- name: auth
  url: http://auth:9999
  routes:
  - name: auth-all
    paths:
    - /auth/v1
    - /auth/v1/*

- name: storage
  url: http://storage:5000
  routes:
  - name: storage-all
    paths:
    - /storage/v1
    - /storage/v1/*

- name: realtime
  url: http://realtime:4000
  routes:
  - name: realtime-all
    paths:
    - /realtime/v1
    - /realtime/v1/*
