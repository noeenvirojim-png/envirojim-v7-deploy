<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Envirojim Operations</title><style>html,body{margin:0;background:#0b1020;color:#edf3ff;font-family:system-ui}#boot{min-height:100vh;display:grid;place-items:center}.box{text-align:center}.spin{width:34px;height:34px;border:3px solid #26324f;border-top-color:#5dd0ff;border-radius:50%;margin:0 auto 16px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div id="boot"><div class="box"><div class="spin"></div><div>Chargement d’Envirojim Operations…</div></div></div><script>(async()=>{try{const parts=await Promise.all([0,1,2,3].map(i=>fetch(`./part${i}.txt?v=29`).then(r=>{if(!r.ok)throw new Error('Asset '+i);return r.text()})));const b64=parts.join('').trim();const bin=atob(b64);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const text=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();document.open();document.write(text);document.close();}catch(e){document.getElementById('boot').innerHTML='<div class="box"><h2>Impossible de charger l’application</h2><p>'+String(e.message||e)+'</p></div>';}})();</script></body></html>
