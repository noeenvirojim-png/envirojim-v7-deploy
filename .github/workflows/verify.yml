name: Verify application

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
      POSTGRES_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
      GEMINI_API_KEY: test-gemini-key
      GOOGLE_AI_API_KEY: test-gemini-key
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        id: typecheck
        continue-on-error: true
        run: npx tsc --noEmit > typecheck-errors.txt 2>&1

      - name: Upload TypeScript report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: typecheck-errors
          path: typecheck-errors.txt
          if-no-files-found: error
          retention-days: 7

      - name: Fail on TypeScript errors
        if: steps.typecheck.outcome == 'failure'
        run: |
          tail -n 120 typecheck-errors.txt
          exit 1

      - name: Production build
        run: npm run build
